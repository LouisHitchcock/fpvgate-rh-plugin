<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FPVGate Split Tuning</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
    body { max-width: 1180px; margin: 0 auto; padding: 1rem; background: #111923; color: #edf2f7; }
    a { color: #8cc8ff; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem 1rem; }
    h1 { margin: .25rem 0; font-size: 1.5rem; }
    #connection { color: #9daebf; }
    #gates { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 1rem; margin-top: 1rem; }
    .gate { min-width: 0; padding: 1rem; border: 1px solid #354558; border-radius: 8px; background: #1b2734; }
    .gate h2 { margin: 0; font-size: 1.15rem; }
    .gate-status { margin: .25rem 0 .75rem; color: #aab8c6; }
    .gate-status.offline { color: #ff9696; }
    .nodes { display: grid; grid-template-columns: 1fr; gap: .75rem; }
    .node { padding: .75rem; border: 1px solid #354558; border-radius: 6px; background: #141e29; }
    .node-title { display: flex; justify-content: space-between; gap: .5rem; margin-bottom: .5rem; font-weight: 600; }
    .rssi { color: #aab8c6; font-variant-numeric: tabular-nums; }
    canvas { display: block; width: 100%; height: 170px; background: #0e151e; border-radius: 4px; }
    .legend { display: flex; flex-wrap: wrap; gap: .8rem; margin: .45rem 0; color: #b7c3cf; font-size: .85rem; }
    .key { display: inline-block; width: 1.2rem; border-top: 2px solid; vertical-align: middle; margin-right: .25rem; }
    .key.rssi-key { color: #61c9ff; }
    .key.enter-key { color: #73e09c; border-top-style: dashed; }
    .key.exit-key { color: #ffbd69; border-top-style: dashed; }
    .controls { display: flex; flex-wrap: wrap; align-items: end; gap: .65rem; margin-top: .55rem; }
    label { display: grid; gap: .2rem; color: #b7c3cf; font-size: .82rem; }
    input { width: 5rem; padding: .4rem; border: 1px solid #506176; border-radius: 4px; background: #0e151e; color: inherit; font: inherit; }
    button { padding: .45rem .8rem; border: 0; border-radius: 4px; background: #2378b9; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    .save-status { min-height: 1.2em; color: #aab8c6; font-size: .85rem; }
    .empty { padding: 1rem; border: 1px solid #354558; border-radius: 8px; color: #b7c3cf; }
    @media (max-width: 520px) { body { padding: .65rem; } .gate { padding: .7rem; } }
  </style>
</head>
<body>
  <header>
    <h1>FPVGate split-gate tuning</h1>
    <a href="/settings">RotorHazard settings</a>
    <span id="connection">Connecting…</span>
  </header>
  <p>Live RSSI over the last 12 seconds. Adjust Enter and Exit for this split gate; changes are saved directly to the gate.</p>
  <main id="gates"></main>
  <script>
    const DATA_URL = '/fpvgate/api/split-tuning';
    const gatesEl = document.getElementById('gates');
    const connectionEl = document.getElementById('connection');
    const cards = new Map();
    const WINDOW_SECONDS = 12;

    async function fetchWithTimeout(url, options = {}) {
      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), 5000);
      try { return await fetch(url, { ...options, signal: controller.signal }); }
      finally { window.clearTimeout(timeout); }
    }

    function makeCard(split) {
      const gate = document.createElement('section');
      gate.className = 'gate';
      gate.dataset.split = split.split;
      const title = document.createElement('h2');
      title.textContent = `Split ${split.split + 1} · ${split.address}`;
      const status = document.createElement('p');
      status.className = 'gate-status';
      const nodes = document.createElement('div');
      nodes.className = 'nodes';
      gate.append(title, status, nodes);
      gatesEl.append(gate);

      const card = { gate, status, nodes: new Map() };
      card.nodesEl = nodes;
      cards.set(split.split, card);
      return card;
    }

    function makeNode(splitId, node) {
      const item = document.createElement('article');
      item.className = 'node';
      const heading = document.createElement('div');
      heading.className = 'node-title';
      const name = document.createElement('span');
      name.textContent = `Node ${node.index + 1} · ${node.frequency || 'off'} MHz`;
      const rssi = document.createElement('span');
      rssi.className = 'rssi';
      const canvas = document.createElement('canvas');
      canvas.setAttribute('aria-label', `Live RSSI graph for split ${splitId + 1}, node ${node.index + 1}`);
      const legend = document.createElement('div');
      legend.className = 'legend';
      legend.innerHTML = '<span><i class="key rssi-key"></i>RSSI</span><span><i class="key enter-key"></i>Enter</span><span><i class="key exit-key"></i>Exit</span>';
      const controls = document.createElement('div');
      controls.className = 'controls';
      const enterLabel = document.createElement('label');
      enterLabel.textContent = 'Enter';
      const enter = document.createElement('input');
      enter.type = 'number'; enter.min = '1'; enter.max = '255'; enter.value = node.enter;
      enterLabel.append(enter);
      const exitLabel = document.createElement('label');
      exitLabel.textContent = 'Exit';
      const exit = document.createElement('input');
      exit.type = 'number'; exit.min = '0'; exit.max = '254'; exit.value = node.exit;
      exitLabel.append(exit);
      const save = document.createElement('button');
      save.type = 'button'; save.textContent = 'Save levels';
      const saveStatus = document.createElement('span');
      saveStatus.className = 'save-status';
      controls.append(enterLabel, exitLabel, save, saveStatus);
      heading.append(name, rssi);
      item.append(heading, canvas, legend, controls);

      const state = { item, name, rssi, canvas, enter, exit, save, saveStatus,
        confirmedEnter: node.enter, confirmedExit: node.exit, dirty: false };
      enter.addEventListener('input', () => { state.dirty = true; });
      exit.addEventListener('input', () => { state.dirty = true; });
      save.addEventListener('click', async () => {
        const enterValue = Number(enter.value), exitValue = Number(exit.value);
        if (!enter.value || !exit.value || !Number.isInteger(enterValue) || !Number.isInteger(exitValue)
            || exitValue < 0 || enterValue > 255 || enterValue <= exitValue) {
          saveStatus.textContent = 'Enter must be higher than Exit and within 0-255.';
          return;
        }
        state.saving = true;
        save.disabled = true;
        saveStatus.textContent = 'Saving…';
        try {
          const response = await fetchWithTimeout(`${DATA_URL}/${splitId}/${node.index}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ enter: enterValue, exit: exitValue })
          });
          const result = await response.json();
          if (!response.ok || !result.ok) throw new Error(result.error || result.message || 'Update failed');
          enter.value = result.enter; exit.value = result.exit;
          state.confirmedEnter = result.enter; state.confirmedExit = result.exit;
          state.dirty = false;
          saveStatus.textContent = 'Saved to gate.';
        } catch (error) {
          enter.value = state.confirmedEnter; exit.value = state.confirmedExit;
          state.dirty = false;
          saveStatus.textContent = error.message;
        } finally {
          state.saving = false;
          save.disabled = false;
        }
      });
      return state;
    }

    function draw(state, history, enter, exit) {
      const canvas = state.canvas;
      const scale = window.devicePixelRatio || 1;
      const width = Math.max(1, canvas.clientWidth), height = Math.max(1, canvas.clientHeight);
      if (canvas.width !== Math.round(width * scale) || canvas.height !== Math.round(height * scale)) {
        canvas.width = Math.round(width * scale); canvas.height = Math.round(height * scale);
      }
      const ctx = canvas.getContext('2d');
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.clearRect(0, 0, width, height);
      const pad = { left: 34, right: 8, top: 10, bottom: 21 };
      const plotW = width - pad.left - pad.right, plotH = height - pad.top - pad.bottom;
      const y = value => pad.top + plotH * (1 - Math.max(0, Math.min(255, value)) / 255);

      ctx.font = '11px system-ui'; ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#283747'; ctx.fillStyle = '#9aabba'; ctx.lineWidth = 1;
      [0, 64, 128, 192, 255].forEach(value => {
        const py = y(value);
        ctx.beginPath(); ctx.moveTo(pad.left, py); ctx.lineTo(width - pad.right, py); ctx.stroke();
        ctx.fillText(String(value), 2, py);
      });
      [[enter, '#73e09c'], [exit, '#ffbd69']].forEach(([value, color]) => {
        const py = y(value); ctx.strokeStyle = color; ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.moveTo(pad.left, py); ctx.lineTo(width - pad.right, py); ctx.stroke();
      });
      ctx.setLineDash([]);

      const end = history.length ? history[history.length - 1][0] : 0;
      const samples = history.filter(sample => end - sample[0] <= WINDOW_SECONDS);
      if (samples.length) {
        ctx.strokeStyle = '#61c9ff'; ctx.lineWidth = 2; ctx.beginPath();
        samples.forEach((sample, index) => {
          const x = pad.left + plotW * (1 - Math.max(0, Math.min(WINDOW_SECONDS, end - sample[0])) / WINDOW_SECONDS);
          const py = y(sample[1]);
          if (!index) ctx.moveTo(x, py); else ctx.lineTo(x, py);
        });
        ctx.stroke();
      }
      ctx.fillStyle = '#9aabba'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(`${WINDOW_SECONDS}s`, width - 30, height - 4);
    }

    function updateNode(card, node) {
      let state = card.nodes.get(node.index);
      if (!state) {
        state = makeNode(Number(card.gate.dataset.split), node);
        card.nodes.set(node.index, state);
        card.nodesEl.append(state.item);
      }
      state.name.textContent = `Node ${node.index + 1} · ${node.frequency || 'off'} MHz`;
      state.rssi.textContent = `RSSI ${node.rssi} · ${node.inside ? 'crossing' : 'clear'}`;
      state.confirmedEnter = node.enter; state.confirmedExit = node.exit;
      if (!state.dirty && !state.saving && document.activeElement !== state.enter && document.activeElement !== state.exit) {
        state.enter.value = node.enter; state.exit.value = node.exit;
      }
      draw(state, node.history || [], Number(state.enter.value), Number(state.exit.value));
    }

    let refreshing = false;
    async function refresh() {
      if (refreshing) return;
      refreshing = true;
      try {
        const response = await fetchWithTimeout(DATA_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error(`RotorHazard returned ${response.status}`);
        const data = await response.json();
        connectionEl.textContent = 'Live';
        connectionEl.style.color = '#73e09c';
        if (!data.splits.length) {
          gatesEl.innerHTML = '<p class="empty">No split gates are configured. Add one in Settings → FPVGate and restart RotorHazard.</p>';
          cards.clear();
          return;
        }
        const empty = gatesEl.querySelector('.empty');
        if (empty) empty.remove();
        for (const split of data.splits) {
          let card = cards.get(split.split);
          if (!card) {
            card = makeCard(split);
          }
          card.status.textContent = split.connected ? `Connected · ${split.address}` : `Offline · ${split.address}`;
          card.status.classList.toggle('offline', !split.connected);
          for (const node of split.nodes) updateNode(card, node);
          const indices = new Set(split.nodes.map(node => node.index));
          for (const [index, state] of card.nodes) {
            if (!indices.has(index)) { state.item.remove(); card.nodes.delete(index); }
          }
          for (const nodeCard of card.nodes.values()) nodeCard.save.disabled = !split.connected || nodeCard.saving;
        }
        const splitIds = new Set(data.splits.map(split => split.split));
        for (const [id, card] of cards) {
          if (!splitIds.has(id)) { card.gate.remove(); cards.delete(id); }
        }
      } catch (error) {
        connectionEl.textContent = `Disconnected · ${error.message}`;
        connectionEl.style.color = '#ff9696';
        for (const card of cards.values()) for (const state of card.nodes.values()) state.save.disabled = true;
      } finally {
        refreshing = false;
      }
    }

    async function poll() {
      await refresh();
      window.setTimeout(poll, 250);
    }
    poll();
    window.addEventListener('resize', refresh);
  </script>
</body>
</html>
